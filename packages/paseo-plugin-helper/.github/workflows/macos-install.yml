name: macos-install
on:
  push:
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      cli_tag:
        description: 'npm dist-tag for @getpaseo/cli'
        default: beta
        required: false
      fleet_filter:
        description: 'Only run plugins whose id contains this string (empty = all)'
        default: ''
        required: false
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  install-fleet:
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      FLEET_FILTER: ${{ inputs.fleet_filter }}
      # Single source of truth: "<plugin-id> <add-args...>" per line.
      FLEET: |
        helper-demo-v8 xpufx/paseo-plugin-helper:demo-v8 --ref v8
        top xpufx/paseo-top --ref v0.8
        mcp-tools xpufx/paseo-mcp-tools --ref v0.8
        x-comms xpufx/paseo-x-comms --ref v0.8
    steps:
      - name: Probe stock toolchain
        run: |
          sw_vers
          which node && node -v
          which npm && npm -v

      - name: Install Paseo CLI (beta)
        run: |
          tag="${{ inputs.cli_tag }}"
          npm install -g "@getpaseo/cli@${tag:-beta}"

      - name: Start ephemeral daemon
        run: |
          export PASEO_HOME="$(mktemp -d)/paseo-home"
          echo "PASEO_HOME=$PASEO_HOME" >> "$GITHUB_ENV"
          paseo daemon start
          paseo status

      - name: Install fleet (sequential, one runner)
        run: |
          matched=0
          while read -r id spec; do
            [ -z "$id" ] && continue
            # shellcheck disable=SC2053
            { [ -z "$FLEET_FILTER" ] || case "$id" in *$FLEET_FILTER*) ;; *) continue;; esac; }
            matched=$((matched + 1))
            # shellcheck disable=SC2086
            paseo plugin add $spec
          done <<< "$FLEET"
          [ -z "$FLEET_FILTER" ] || [ "$matched" -gt 0 ] || { echo "no plugins matched filter '$FLEET_FILTER'"; exit 1; }

      - name: List fleet
        if: always()
        run: |
          set -o pipefail
          paseo plugin ls
          echo "$FLEET" | while read -r id spec; do
            [ -z "$id" ] && continue
            # shellcheck disable=SC2053
            { [ -z "$FLEET_FILTER" ] || case "$id" in *$FLEET_FILTER*) ;; *) continue;; esac; }
            paseo plugin logs "$id" | tail -10
          done

  gate-fails-clean:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Probe stock toolchain
        run: |
          sw_vers
          which node && node -v

      - name: Install Paseo CLI (beta)
        run: |
          tag="${{ inputs.cli_tag }}"
          npm install -g "@getpaseo/cli@${tag:-beta}"

      - name: Start ephemeral daemon (broken toolchain simulation)
        run: |
          export PASEO_HOME="$(mktemp -d)/paseo-home"
          echo "PASEO_HOME=$PASEO_HOME" >> "$GITHUB_ENV"
          echo "CHECK_BIN_NODE=node-definitely-missing" >> "$GITHUB_ENV"
          echo "CHECK_BIN_NPM=npm-definitely-missing" >> "$GITHUB_ENV"
          export CHECK_BIN_NODE=node-definitely-missing CHECK_BIN_NPM=npm-definitely-missing
          paseo daemon start
          paseo status

      - name: Install must fail with readable error
        run: |
          set +e
          out=$(paseo plugin add xpufx/paseo-plugin-helper:demo-v8 --ref v8 2>&1)
          code=$?
          set -e
          echo "$out"
          [ $code -ne 0 ] || { echo "expected install to fail"; exit 1; }
          echo "$out" | grep -F "required binary"
