name: windows-install-stable
on:
  push:
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      cli_tag:
        description: 'npm dist-tag for @getpaseo/cli'
        default: 0.7.2
        required: false
      fleet_filter:
        description: 'Only run plugins whose id contains this string (empty = all)'
        default: ''
        required: false
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  install-fleet:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      # v7-era fleet: main branch, no --ref. Control run for the
      # beta Windows spawn-npm-ENOENT failure.
      FLEET_FILTER: ${{ inputs.fleet_filter }}
      FLEET: |
        helper-demo xpufx/paseo-plugin-helper:demo
        top xpufx/paseo-top
        mcp-tools xpufx/paseo-mcp-tools
        x-comms xpufx/paseo-x-comms
    steps:
      - name: Probe stock toolchain
        run: |
          [System.Environment]::OSVersion | Format-List
          where.exe node
          node -v
          where.exe npm
          npm -v

      - name: Install Paseo CLI (stable)
        run: |
          $tag = "${{ inputs.cli_tag }}"
          if ([string]::IsNullOrWhiteSpace($tag)) { $tag = "0.7.2" }
          npm install -g "@getpaseo/cli@$tag"

      - name: Start ephemeral daemon
        run: |
          $tmp = New-Item -ItemType Directory -Path (Join-Path ([System.IO.Path]::GetTempPath()) ([System.IO.Path]::GetRandomFileName()))
          $paseoHome = Join-Path $tmp.FullName "paseo-home"
          $env:PASEO_HOME = $paseoHome
          "PASEO_HOME=$paseoHome" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          paseo daemon start
          paseo status

      - name: Install fleet (sequential, one runner)
        run: |
          $matched = 0
          $env:FLEET -split '\r?\n' | ForEach-Object {
            $line = $_.Trim()
            if ([string]::IsNullOrWhiteSpace($line)) { return }
            $id, $spec = $line -split ' ', 2
            if ($env:FLEET_FILTER -and $id -notlike "*$($env:FLEET_FILTER)*") { return }
            $matched++
            $specParts = $spec -split '\s+'
            & paseo plugin add @specParts
          }
          if ($env:FLEET_FILTER -and $matched -eq 0) { throw "no plugins matched filter '$($env:FLEET_FILTER)'" }

      - name: List fleet
        if: always()
        run: |
          paseo plugin ls
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:FLEET -split '\r?\n' | ForEach-Object {
            $line = $_.Trim()
            if ([string]::IsNullOrWhiteSpace($line)) { return }
            $id, $spec = $line -split ' ', 2
            if ($env:FLEET_FILTER -and $id -notlike "*$($env:FLEET_FILTER)*") { return }
            & paseo plugin logs $id | Select-Object -Last 10
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
