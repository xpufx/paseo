# CI half of the npm stage → human-approve handoff (xpufx-org/paseo#211).
#
# Two stage paths, one job:
#   1. Local pack: `node scripts/publish-npm.mjs --stage` packs every plugin
#      directory into `publish-stage/<id>/<tarball>` + `manifest.json` +
#      `PUBLISH.md`, and refuses a dirty tree. This is inert — no registry.
#   2. npm-native staged publishing (when the NPM_STAGE secret is set): `npm
#      stage publish <tarball>` (npm >= 11.19) puts each version into the
#      registry's staging area (not publicly visible) WITHOUT a 2FA prompt.
#      A human later runs `npm stage approve <id>` (2FA) to promote to live.
#
# The 2FA publish/approve step stays manual and on the human. The job never
# runs `npm publish`; it only stages. Skipped for the stage-publish step when
# the secret is absent, so a PR run still exercises the local stage/artifact
# path without a token.
#
# Triggers: push to main stages the tree that would be published; pull_request
# exercises the same flow on the change that touches it; workflow_dispatch
# allows a manual re-stage. Runner conventions (runs-on label, registry image)
# are copied from install-smoke.yml.
name: npm stage (publishable tarballs)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  npm-stage:
    name: Stage publishable plugin tarballs
    runs-on: alpine-docker
    # Clean Ubuntu 24.04 + Node 22 + git/make/jq image, same as install-smoke.
    container:
      image: forge.mrs.uppidi.com/oktay/runner-containers/ubuntu-podman-builder:latest
    env:
      # Deterministic cache inside the throwaway container. `npm pack` reads the
      # local plugin dirs only — no registry contact.
      npm_config_cache: /tmp/paseo-npm-pack-cache
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          set -euo pipefail
          node --version
          npm --version
          git --version

      - name: Unit-test the stage/publish logic
        run: node scripts/publish-npm.test.mjs

      - name: Stage plugin tarballs (no registry, no credentials)
        run: make npm-stage

      - name: Assert the stage is complete and self-consistent
        run: |
          set -euo pipefail
          test -f publish-stage/manifest.json || { echo "::error::publish-stage/manifest.json missing"; exit 1; }
          test -f publish-stage/PUBLISH.md || { echo "::error::publish-stage/PUBLISH.md missing"; exit 1; }
          node <<'NODE_EOF'
            const fs = require("fs");
            const manifest = JSON.parse(fs.readFileSync("publish-stage/manifest.json", "utf8"));
            const packages = Array.isArray(manifest.packages) ? manifest.packages : [];
            if (packages.length === 0) { console.error("::error::no packages staged"); process.exit(1); }
            let bad = 0;
            for (const p of packages) {
              const file = `publish-stage/${p.tarball}`;
              if (!fs.existsSync(file)) { console.error(`::error::missing staged tarball ${file}`); bad = 1; }
              if (!p.shasum || !p.version || !p.publishAs) { console.error(`::error::incomplete manifest entry for ${p.id}`); bad = 1; }
            }
            if (bad) process.exit(1);
            console.log(`staged ${packages.length} package(s) from ${manifest.gitBranch ?? "?"}@${String(manifest.gitCommit ?? "?").slice(0, 12)}`);
          NODE_EOF

      - name: Stage to npmjs Staged Packages (npm-native, no 2FA)
        # npm >= 11.19 staged publishing: `npm stage publish` puts each tarball
        # into the registry's staging area (not publicly visible) without a 2FA
        # prompt. A human later runs `npm stage approve <id>` (2FA) to promote.
        # Requires the NPM_STAGE token secret (repo secrets). Skipped when the
        # secret is absent so a PR run still exercises the local stage/artifact
        # path without a token.
        env:
          NPM_TOKEN: ${{ secrets.NPM_STAGE }}
        if: env.NPM_TOKEN != ''
        run: |
          set -euo pipefail
          test -f publish-stage/manifest.json || { echo "::error::manifest missing"; exit 1; }
          # `npm stage publish` needs npm >= 11.19; the container ships npm 10.
          # Install a recent npm into a user-writable prefix (runner is
          # non-root). Only this step uses it, so the earlier pack step keeps
          # the container npm (10.x) and its `npm pack --json` output shape.
          npm install --prefix "$HOME/npm" npm@latest >/dev/null 2>&1
          export PATH="$HOME/npm/node_modules/.bin:$PATH"
          npm --version
          npm stage --help >/dev/null || { echo "::error::npm stage not available after upgrade"; exit 1; }
          # Authenticate for `npm stage publish` (any token type works, no 2FA).
          printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" > "$HOME/.npmrc"
          jq -e -r '.packages[].tarball | "publish-stage/\(.)"' publish-stage/manifest.json | while read -r tarball; do
            echo "staging $tarball"
            npm stage publish "$tarball" --access public
          done

      - name: Upload publish-stage/ artifact
        # The Forgejo-maintained fork has the GHES check removed; the upstream
        # actions/upload-artifact@v4 refuses non-GitHub servers. Pinned to the
        # v4.3.1 commit rather than the movable `v4` tag, per Forgejo's own
        # testing.yml warning that a tag can resolve to a commit without the
        # compatibility patch.
        uses: https://data.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e
        with:
          name: publish-stage
          path: publish-stage/
          if-no-files-found: error
          retention-days: 14

      - name: Job summary — staged packages and the human publish path
        if: always()
        env:
          NPM_TOKEN: ${{ secrets.NPM_STAGE }}
        run: |
          set -euo pipefail
          {
            echo "## npm stage — staged plugin tarballs"
            echo
            if [ -f publish-stage/manifest.json ]; then
          node -e '
            const fs = require("fs");
            const m = JSON.parse(fs.readFileSync("publish-stage/manifest.json", "utf8"));
            console.log("Staged " + (m.gitBranch || "?") + "@" + String(m.gitCommit || "?").slice(0, 12) + " at " + m.stagedAt + ".");
            console.log();
            console.log("| package | version | tarball | shasum |");
            console.log("| --- | --- | --- | --- |");
            for (const p of m.packages) console.log("| " + String.fromCharCode(96) + p.publishAs + String.fromCharCode(96) + " | " + String.fromCharCode(96) + p.version + String.fromCharCode(96) + " | " + String.fromCharCode(96) + p.tarball + String.fromCharCode(96) + " | " + String.fromCharCode(96) + p.shasum + String.fromCharCode(96) + " |");
          '
            else
              echo "No stage was produced in this run."
            fi
            echo
            if [ -n "${NPM_TOKEN:-}" ]; then
              echo "Staged to npmjs (npm-native). Approve to promote to live (2FA) from your workstation:"
              echo
              echo '```sh'
              echo "npm stage list"
              echo "npm stage view <stage-id>"
              echo "npm stage approve <stage-id>"
              echo '```'
            else
              echo "Download the \`publish-stage\` artifact, then publish from your workstation (prompts for npm 2FA/OTP):"
              echo
              echo '```sh'
              echo "node scripts/publish-npm.mjs --publish"
              echo '```'
            fi
            echo
            echo "The 2FA publish/approve step stays manual on the human."
          } >> "$GITHUB_STEP_SUMMARY"
