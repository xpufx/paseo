# Pre-release install gate: proves the tree the mirror WOULD publish actually
# installs, before the mirror moves. Replaces the old post-push smoke that only
# validated `top` + `demo` after the public mirror had already advanced.
#
# Order (mirrors .agents/skills/plugin-release/SKILL.md):
#   1. hygiene     — no private strings / missing READMEs on the publish surface
#   2. vendor gate — materialize any dev link, then vendor-sync --check is clean
#   3. staged tree — mirror-github.mjs --dry-run prepares the exact scoped tree
#                    (all 8 plugins + helper) and commits it to a temp LOCAL bare
#                    remote; no GitHub push happens here
#   4. install     — `paseo plugin add file://<staged> --ref <commit>` for every
#                    plugin dir, asserting status=running
#   5. mirror push — only on an explicit `workflow_dispatch` with `mirror: true`,
#                    after 3+4 pass, push the same scoped tree to the public
#                    GitHub mirror with secrets.FJ_GITHUB_MIRROR_TOKEN (Forgejo
#                    reserves the `GITHUB_` secret prefix). Never on a
#                    plain push: the gate verifies every push, the mirror moves
#                    on demand.
#
# `helper` (packages/paseo-plugin-helper) is a workspace package, not a plugins/
# directory, so it is part of the staged mirror target set (it must survive the
# mirror prune) but is validated by the vendor gate, not by `paseo plugin add`.
#
# Runner conventions (runs-on label, registry image) are copied from
# xpufx/aur-automation/.forgejo/workflows/*.
name: Install smoke (public mirror)

on:
  workflow_dispatch:
    inputs:
      mirror_url:
        description: >-
          Override install source: a Git URL to install from directly. Leave
          empty to gate the staged scoped tree the mirror would publish.
        required: false
        default: ""
        type: string
      mirror_ref:
        description: "Branch, tag, or commit for mirror_url (empty = mirror main HEAD)"
        required: false
        default: ""
        type: string
      plugins:
        description: >-
          Space-separated plugin DIRECTORY names under plugins/ (default: all
          eight plugins). Each directory's runtime plugin id is resolved from
          its paseo-plugin.json manifest after install, so it need not match the
          directory name.
        required: false
        default: "mcp-tools forges x-comms slash twofado plugin-updates top demo"
        type: string
      mirror:
        description: >-
          Also push the staged tree to the public GitHub mirror. Default false:
          the gate only verifies. Set true to release the scoped tree.
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  install-smoke:
    name: Install plugins with Paseo ${{ matrix.paseo-version }}
    runs-on: alpine-docker
    # Keep the supported stable line visible without allowing it to block the
    # current beta release gate. `fail-fast: false` ensures a 0.8 regression
    # never prevents the gating beta lane from reporting its result.
    continue-on-error: ${{ matrix.allow-failure }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - paseo-version: 0.8.0
            allow-failure: true
          - paseo-version: 0.9.0-beta.2
            allow-failure: false
    # Clean Ubuntu 24.04 + Node 22 + git/make/jq image. A fresh container per
    # run is the point: no reused node_modules and no pre-existing daemon state.
    container:
      image: forge.mrs.uppidi.com/oktay/runner-containers/ubuntu-podman-builder:latest
    env:
      # Dedicated daemon home, wiped below, so the job never reuses state.
      PASEO_HOME: /tmp/paseo-install-smoke/home
      # Cumulative mirror target set: every plugin directory plus helper. Always
      # the full set so the staged tree matches what the mirror publishes (a
      # subset target would prune the other plugins from the public repo).
      MIRROR_TARGETS: "top,demo,mcp-tools,forges,x-comms,slash,twofado,plugin-updates,helper"
      DEFAULT_PLUGINS: "mcp-tools forges x-comms slash twofado plugin-updates top demo"
      MIRROR_URL_IN: ${{ github.event.inputs.mirror_url }}
      MIRROR_REF_IN: ${{ github.event.inputs.mirror_ref }}
      PLUGINS_IN: ${{ github.event.inputs.plugins }}
      # `git commit-tree` (mirror-github.mjs) needs a committer identity; a
      # clean runner container has none. Applies to the staged tree and the
      # real mirror commit alike.
      GIT_AUTHOR_NAME: paseo-install-smoke
      GIT_AUTHOR_EMAIL: install-smoke@paseo.invalid
      GIT_COMMITTER_NAME: paseo-install-smoke
      GIT_COMMITTER_EMAIL: install-smoke@paseo.invalid
    steps:
      - name: Report runner diagnostics
        if: always()
        env:
          RUNNER_OS: ${{ runner.os }}
          RUNNER_ARCH: ${{ runner.arch }}
        run: |
          runner_host="${XP_RUNNER_HOST:-<unset>}"
          printf 'Runner OS: %s\nRunner architecture: %s\nRunner host: %s\n' "$RUNNER_OS" "$RUNNER_ARCH" "$runner_host"
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            printf "## Runner diagnostics\n\n- OS: \`%s\`\n- Architecture: \`%s\`\n- Host: \`%s\`\n" "$RUNNER_OS" "$RUNNER_ARCH" "$runner_host" >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/checkout@v4

      - name: Hygiene — publish surface has no private strings or missing READMEs
        run: |
          set -euo pipefail
          # plugin-release SKILL.md §1/§2. No allowlist, and `dist` is scanned
          # too: built artifacts ship in the mirror, so a stale dist is a leak
          # even when src is clean. Nothing internal may reach the public tree.
          hits="$(git grep -n -E 'oktay|aager|mrs\.aager\.de|pufaysokt|oktaya|/home/xpufx' -- 'plugins/*' 'packages/*' ':!*node_modules*' || true)"
          if [ -n "$hits" ]; then
            printf '%s\n' "$hits"
            echo "::error::private strings on the publish surface — see .agents/skills/plugin-release/SKILL.md §1"
            exit 1
          fi
          missing=0
          for p in plugins/*/; do
            [ -f "${p}README.md" ] || { echo "::error::missing README: ${p}"; missing=1; }
            # paseo.cafe catalog `hasLicense`: every plugin must declare MIT.
            lic="$(node -e "console.log(require('./${p}package.json').license)" 2>/dev/null || echo MISSING)"
            [ "$lic" = "MIT" ] || { echo "::error::${p}package.json license must be MIT (got: ${lic})"; missing=1; }
          done
          [ "$missing" -eq 0 ] || exit 1
          # Issue #206: every plugin with screenshots must expose them through
          # an `images` symlink (fatal). A missing screenshots dir is only a
          # warning (non-fatal: coming-soon / WIP plugins like twofado, x-comms).
          badlink=0
          for p in plugins/*/; do
            shots=""
            if [ -d "${p}screenshots" ]; then shots="${p}screenshots"; fi
            if [ -d "${p}docs/screenshots" ]; then shots="${p}docs/screenshots"; fi
            if [ -z "$shots" ]; then
              echo "::warning::no screenshots directory: ${p}"
              continue
            fi
            if [ ! -L "${p}images" ]; then
              echo "::error::missing images symlink: ${p} (has ${shots}, expected ${p}images -> screenshots)"
              badlink=1
            elif [ ! -d "${p}images" ]; then
              echo "::error::dangling images symlink: ${p}images -> $(readlink "${p}images")"
              badlink=1
            fi
          done
          [ "$badlink" -eq 0 ] || exit 1
          echo "hygiene clean"

      - name: Gate — vendored copy trees are publishable
        run: |
          set -euo pipefail
          # Dev imports the bare paseo-plugin-helper specifier (resolved to the
          # helper src via the workspace link + tsconfig paths); the vendored
          # copies are the publish artifact the mirror stages and this gate
          # installs. Materialize any legacy working-tree dev symlink first (a
          # no-op on a clean checkout), then assert no copy drift and no
          # committed symlink under a vendored helper path. The gate must never
          # smoke or publish a linked/partial tree — such a tree installs as a
          # broken plugin (#146).
          node scripts/vendor-sync.mjs
          node scripts/vendor-sync.mjs --check
          linked="$(git ls-files -s | awk '$1==120000 && $4 ~ /\/vendor\/paseo-plugin-helper\// {print $4}')"
          if [ -n "$linked" ]; then
            printf '%s\n' "$linked"
            echo "::error::committed symlink under a vendored helper path is not installable"
            exit 1
          fi

      - name: Prepare staged mirror tree (dry-run of the scoped publish set)
        id: stage
        run: |
          set -euo pipefail
          STAGE_ROOT="$(mktemp -d)"
          MIRROR_REPO="$STAGE_ROOT/mirror.git"
          # A local bare remote stands in for github.com so the mirror's dry-run
          # push is a real git operation against a throwaway repo — never the
          # public mirror.
          git init --bare --quiet "$MIRROR_REPO"
          git -C "$MIRROR_REPO" symbolic-ref HEAD refs/heads/main
          git remote remove staged-smoke 2>/dev/null || true
          git remote add staged-smoke "$MIRROR_REPO"
          GITHUB_REMOTE=staged-smoke node scripts/mirror-github.mjs \
            --target="$MIRROR_TARGETS" --dry-run | tee "$STAGE_ROOT/mirror.log"
          TREE="$(sed -n 's/.*Prepared tree ID: //p' "$STAGE_ROOT/mirror.log" | tail -n1)"
          COMMIT="$(sed -n 's/.*Created commit ID: //p' "$STAGE_ROOT/mirror.log" | tail -n1)"
          if [ -z "$TREE" ] || [ -z "$COMMIT" ]; then
            echo "::error::mirror dry-run did not prepare a tree/commit"
            exit 1
          fi
          # Publish the prepared commit into the local bare remote so
          # `paseo plugin add file://...` clones exactly the staged tree.
          git push --quiet staged-smoke "${COMMIT}:refs/heads/main"
          echo "staged_url=file://${MIRROR_REPO}" >> "$GITHUB_OUTPUT"
          echo "staged_ref=${COMMIT}" >> "$GITHUB_OUTPUT"
          echo "staged_tree=${TREE}" >> "$GITHUB_OUTPUT"
          echo "staged scoped tree: ${MIRROR_REPO} @ ${COMMIT} (tree ${TREE})"

      - name: Resolve install source and plugin set
        id: source
        run: |
          set -euo pipefail
          if [ -n "${MIRROR_URL_IN:-}" ]; then
            URL="$MIRROR_URL_IN"
            REF="${MIRROR_REF_IN:-}"
            if [ -z "$REF" ]; then
              # Pin the exact mirror commit a third party would resolve today,
              # rather than a moving branch name.
              REF="$(git ls-remote "$URL" main | awk 'NR==1{print $1}')"
            fi
            if [ -z "$REF" ]; then
              echo "::error::could not resolve a ref from ${URL} (is the mirror public and reachable?)"
              exit 1
            fi
            echo "installing from configured mirror: ${URL} @ ${REF}"
          else
            URL="${{ steps.stage.outputs.staged_url }}"
            REF="${{ steps.stage.outputs.staged_ref }}"
            echo "installing from the staged tree: ${URL} @ ${REF}"
          fi
          PLUGINS="${PLUGINS_IN:-$DEFAULT_PLUGINS}"
          echo "plugin set: ${PLUGINS}"
          echo "url=${URL}" >> "$GITHUB_OUTPUT"
          echo "ref=${REF}" >> "$GITHUB_OUTPUT"
          echo "plugins=${PLUGINS}" >> "$GITHUB_OUTPUT"

      - name: Install Paseo CLI ${{ matrix.paseo-version }}
        run: |
          set -euo pipefail
          if [ "$(id -u)" -eq 0 ]; then
            npm i -g @getpaseo/cli@${{ matrix.paseo-version }}
          else
            sudo npm i -g @getpaseo/cli@${{ matrix.paseo-version }}
          fi
          paseo --version

      - name: Bootstrap clean daemon home
        run: |
          set -euo pipefail
          rm -rf "$PASEO_HOME"
          mkdir -p "$PASEO_HOME"
          # Trusted plugins sit behind a global switch that defaults to off.
          # Enable it headlessly (the equivalent of the Paseo UI toggle) so an
          # installed plugin is actually compiled and started, and its status
          # becomes observable instead of sitting at "disabled".
          printf '{\n  "version": 1,\n  "pluginsEnabled": true\n}\n' > "$PASEO_HOME/config.json"

      - name: Start headless daemon and wait for health
        run: |
          set -euo pipefail
          # Paseo 0.8 accepts launch-time daemon options and returns as soon as
          # it has handed the daemon off. In 0.9 those options are persistent
          # daemon configuration; `daemon start` then waits for readiness.
          # Keep the legacy invocation isolated so its compatibility result
          # remains informational, while the current lane uses the 0.9 API.
          if [ "${{ matrix.paseo-version }}" = "0.8.0" ]; then
            paseo daemon start --listen 127.0.0.1:6767 --no-relay --no-web-ui
          else
            paseo daemon config set daemon.listen 127.0.0.1:6767 --home "$PASEO_HOME"
            paseo daemon config set daemon.relay.enabled false --home "$PASEO_HOME"
            paseo daemon config set features.webUi.enabled false --home "$PASEO_HOME"
            paseo daemon start --home "$PASEO_HOME"
          fi
          for _ in $(seq 1 60); do
            if paseo status --json 2>/dev/null | jq -e '.localDaemon == "running" and .connectedDaemon == "reachable"' >/dev/null; then
              echo "daemon healthy"
              paseo status --json
              exit 0
            fi
            sleep 1
          done
          echo "::error::daemon did not become healthy within 60s"
          paseo status --json || true
          tail -n 200 "$PASEO_HOME/daemon.log" || true
          exit 1

      # The action installs each directory, resolves its runtime plugin id from
      # the manifest, and asserts that id reaches running. On the staged path the
      # source is a local `file://` clone of the prepared tree, so this red result
      # precedes any real mirror push.
      #
      # For Paseo 0.8.0 legacy lane: plugins that require Paseo 0.9 (like x-comms)
      # are skipped from the install test, but announced in the log as a reminder.
      - name: Resolve effective plugins for matrix lane
        id: effective-plugins
        run: |
          set -euo pipefail
          PLUGINS="${{ steps.source.outputs.plugins }}"
          if [ "${{ matrix.paseo-version }}" = "0.8.0" ]; then
            echo "::notice::Paseo 0.8.0 legacy lane: skipping x-comms (requires Paseo >=0.9.0-beta.2 per issue #296)"
            PLUGINS="$(echo "$PLUGINS" | tr ' ' '\n' | grep -v '^x-comms$' | tr '\n' ' ' | xargs)"
          fi
          echo "plugins=${PLUGINS}" >> "$GITHUB_OUTPUT"
      - name: Install each plugin from the staged tree and assert it is running
        uses: ./.forgejo/actions/install-plugin-smoke
        with:
          mirror-url: ${{ steps.source.outputs.url }}
          mirror-ref: ${{ steps.source.outputs.ref }}
          plugins: ${{ steps.effective-plugins.outputs.plugins }}

      # Legacy compatibility is informational: make a failed 0.8 observation
      # conspicuous in the run while `continue-on-error` keeps the beta gate
      # authoritative. The warning links the maintainer directly to its ticket.
      - name: Report Paseo 0.8 compatibility failure
        if: ${{ always() && matrix.allow-failure && failure() }}
        run: |
          echo "::warning title=Paseo 0.8.0 install smoke failed::The legacy compatibility lane failed. See https://forge.mrs.uppidi.com/xpufx-org/paseo/issues/296."

      # On-demand only: the gate verifies every push/PR, but the public mirror
      # moves only when dispatched with `mirror: true`, after the staged-tree
      # smoke above passed. A missing secret is a warning, not a failure.
      - name: Push staged tree to the public GitHub mirror (on demand)
        # Publishing remains a single, current-version gate: the legacy 0.8
        # compatibility observation must never publish a second mirror commit.
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mirror == 'true' && matrix.allow-failure == false }}
        env:
          GITHUB_MIRROR_TOKEN: ${{ secrets.FJ_GITHUB_MIRROR_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GITHUB_MIRROR_TOKEN:-}" ]; then
            echo "::warning::FJ_GITHUB_MIRROR_TOKEN is not configured — the GitHub mirror was NOT pushed."
            echo "::warning::Add repository/organization secret FJ_GITHUB_MIRROR_TOKEN (a GitHub fine-grained PAT with Contents: Read and write on xpufx/paseo) to enable the automatic mirror push."
            exit 0
          fi
          # Authenticate without ever putting the token in a logged URL.
          git remote remove github 2>/dev/null || true
          git remote add github https://github.com/xpufx/paseo.git
          git config --local http.https://github.com/.extraheader \
            "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_MIRROR_TOKEN" | base64 | tr -d '\n')"
          git fetch --depth=1 github "${{ github.event.inputs.mirror_ref || 'main' }}" || true
          node scripts/mirror-github.mjs --target="$MIRROR_TARGETS"
